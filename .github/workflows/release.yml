name: release

on:
  push:
    branches: [main]
  # A release can fail on one package and succeed on the others, so there has to
  # be a way to run it again without inventing a commit.
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      # Changesets opens the Version Packages pull request. This permission is
      # not enough on its own: Settings, Actions, General, Workflow permissions
      # has a separate box for letting Actions create pull requests, and it is
      # off by default.
      pull-requests: write
      # Required by npm trusted publishing. It is what replaces the token.
      id-token: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org

      # Trusted publishing needs npm 11.5.1 or later. The version bundled with
      # setup-node lags behind, so it is upgraded here.
      - run: npm install --global npm@latest

      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm test

      # Opens or updates the Version Packages pull request. Merging it runs this
      # workflow again, this time with versions already bumped, and publish
      # takes over.
      - uses: changesets/action@v1.9.0
        with:
          version: pnpm changeset version
          publish: pnpm changeset publish
          commit: 'chore(repo): version packages'
          title: 'chore(repo): version packages'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
