name: ci

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [20, 22, 24]
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: commit format
        if: github.event_name == 'pull_request'
        run: >-
          pnpm exec commitlint
          --from ${{ github.event.pull_request.base.sha }}
          --to ${{ github.event.pull_request.head.sha }}
          --verbose

      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm build
      - run: pnpm typecheck
      - run: pnpm test

      - name: packaging
        run: pnpm publint

      - name: published types
        run: pnpm attw

      - name: bundle size
        run: pnpm size

      # npm pack rather than npm publish --dry-run: the latter asks the registry
      # whether the version is free, which fails on every commit between a
      # release and the next version bump. What is worth checking here is what
      # goes into the tarball, and publint already covers the exports map.
      - name: tarball contents
        run: pnpm -r --filter "./packages/**" exec npm pack --dry-run

  changeset:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: a package changed without a changeset
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          changed=$(git diff --name-only "$BASE" "$HEAD" -- packages/ | wc -l)
          added=$(git diff --name-only --diff-filter=A "$BASE" "$HEAD" -- .changeset/ \
            | grep -v 'config.json' | grep -c '\.md$' || true)
          if [ "$changed" -gt 0 ] && [ "$added" -eq 0 ]; then
            echo "files under packages/ changed and no changeset was added"
            echo "run pnpm changeset"
            exit 1
          fi
